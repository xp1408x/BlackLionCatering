<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Lion Catering</title>
  <meta name="description" content="Black Lion Catering: Modern and elegant catering for weddings, quinceañeras, social and corporate events. Unforgettable flavors and experiences for your celebrations." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            leagueGothic: ['"League Gothic"', 'sans-serif'],
            roboto: ['Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              dark: '#1a1a1a',
              light: '#f0f0f0',
              accent: '#d4af37', // A gold-like accent for luxury
            }
          }
        }
      }
    }
  </script>
  <style>
    @font-face {
      font-family: 'League Gothic';
      src: url('/src/font/LeagueGothic-Regular.woff2') format('truetype');
      font-weight: 400;
      font-style: regular;
      font-display: swap;
    }
    @font-face {
      font-family: 'Roboto';
      src: url('/src/font/Roboto-Medium.woff2') format('truetype');
      font-weight: 400;
      font-style: medium;
      font-display: swap;
    }
    body {
      font-family: 'Inter', sans-serif;
    }
    h1, h2, h3, h4, h5, h6, .font-title { 
      font-family: 'League Gothic', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.025em; /* Adjusted for League Gothic readability */
    }
    .font-roboto {
      font-family: 'Roboto', sans-serif;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.1.0/",
    "react": "https://esm.sh/react@^19.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
